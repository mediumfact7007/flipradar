name: Finalize V0.9.1 QA

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  patch-test-build:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply QA fixes
        run: python3 tools/finalize_v091.py

      - name: Apply edge cases found by QA
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('lib/v09_app.dart')
          s = p.read_text()
          old = "RegExp(r'\\b\\d[\\d.\\s]*(?:,\\d{1,2})?\\s*€\\b')"
          new = "RegExp(r'\\b\\d[\\d.\\s]*(?:,\\d{1,2})?\\s*€')"
          if old not in s:
              raise SystemExit('Shared-price cleanup pattern not found')
          p.write_text(s.replace(old, new, 1))

          p = Path('lib/v07_library.dart')
          s = p.read_text()
          pattern = re.compile(r"  Future<void> _markSold\(BuildContext context\) async \{.*?\n  \}\n\}", re.S)
          replacement = '''  Future<void> _markSold(BuildContext context) async {
            var entered = item.sell > 0 ? item.sell.toStringAsFixed(0) : '';
            final value = await showDialog<double>(
              context: context,
              builder: (dialogContext) => AlertDialog(
                title: Text(t('Verkaufspreis', 'Sale price')),
                content: TextFormField(
                  initialValue: entered,
                  autofocus: true,
                  keyboardType: const TextInputType.numberWithOptions(decimal: true),
                  decoration: const InputDecoration(suffixText: '€'),
                  onChanged: (value) => entered = value,
                  onFieldSubmitted: (value) {
                    final parsed = _parseLibraryMoney(value);
                    if (parsed > 0) Navigator.pop(dialogContext, parsed);
                  },
                ),
                actions: [
                  TextButton(
                    onPressed: () => Navigator.pop(dialogContext),
                    child: Text(t('Abbrechen', 'Cancel')),
                  ),
                  FilledButton(
                    onPressed: () {
                      final parsed = _parseLibraryMoney(entered);
                      if (parsed > 0) Navigator.pop(dialogContext, parsed);
                    },
                    child: Text(t('Speichern', 'Save')),
                  ),
                ],
              ),
            );
            if (value != null) onUpdate(item.copyWith(status: 'Sold', sell: value));
          }
          }'''
          s, count = pattern.subn(replacement, s, count=1)
          if count != 1:
              raise SystemExit('Sale dialog method not found')
          p.write_text(s)

          p = Path('test/library_flow_test.dart')
          s = p.read_text()
          s = s.replace(
              "await tester.tap(find.text('Verkauft'));",
              "await tester.tap(find.widgetWithText(FilledButton, 'Verkauft'));",
              1,
          )
          s = s.replace(
              "await tester.enterText(find.byType(TextField), '1.299,99');",
              "await tester.enterText(find.byType(TextFormField), '1.299,99');",
              1,
          )
          p.write_text(s)

          p = Path('test/deal_flow_test.dart')
          s = p.read_text().replace("expect(find.text('1.481 €'), findsOneWidget);", "expect(find.text('1481 €'), findsOneWidget);", 1)
          p.write_text(s)
          PY

      - name: Check backend and smoke test
        shell: bash
        run: |
          node --check server/index.js
          PORT=8099 node server/index.js >/tmp/flipradar-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:8099/health >/tmp/health.json; then break; fi
            sleep 0.25
          done
          cat /tmp/health.json
          grep -q '"ok":true' /tmp/health.json
          grep -q '"version":"0.9.1"' /tmp/health.json
          curl -fsS http://127.0.0.1:8099/v1/status >/tmp/status.json
          grep -q '"sources"' /tmp/status.json
          code=$(curl -sS -o /tmp/bad-source.json -w '%{http_code}' 'http://127.0.0.1:8099/v1/market/search?source=bad&q=test')
          test "$code" = "400"
          grep -q 'unsupported_source' /tmp/bad-source.json

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android project
        shell: bash
        run: |
          rm -rf /tmp/flipradar_lib
          cp -r lib /tmp/flipradar_lib
          cp pubspec.yaml /tmp/flipradar_pubspec.yaml
          rm -rf android
          flutter create . --platforms=android --org com.flipradar --project-name flipradar --no-pub
          rm -rf lib
          cp -r /tmp/flipradar_lib lib
          cp /tmp/flipradar_pubspec.yaml pubspec.yaml
          python3 - <<'PY2'
          from pathlib import Path
          app_gradle = Path('android/app/build.gradle.kts')
          if app_gradle.exists():
              text = app_gradle.read_text().replace('applicationId = "com.flipradar.flipradar"', 'applicationId = "com.flipradar.app"')
              app_gradle.write_text(text)
          root_gradle = Path('android/build.gradle.kts')
          if root_gradle.exists():
              text = root_gradle.read_text()
              if '// FlipRadar: align Java tasks with Flutter/Kotlin 17' not in text:
                  text += '''
          // FlipRadar: align Java tasks with Flutter/Kotlin 17
          subprojects {
              tasks.withType<org.gradle.api.tasks.compile.JavaCompile>().configureEach {
                  sourceCompatibility = "17"
                  targetCompatibility = "17"
              }
          }
          '''
              root_gradle.write_text(text)
          props = Path('android/gradle.properties')
          if props.exists():
              text = props.read_text()
              if 'kotlin.jvm.target.validation.mode=' not in text:
                  text += '\nkotlin.jvm.target.validation.mode=warning\n'
              props.write_text(text)
          manifest = Path('android/app/src/main/AndroidManifest.xml')
          if manifest.exists():
              text = manifest.read_text().replace('android:label="flipradar"', 'android:label="FlipRadar"')
              text = text.replace('android:launchMode="singleTop"', 'android:launchMode="singleTask"')
              marker = '<manifest xmlns:android="http://schemas.android.com/apk/res/android">'
              for permission in [
                  '<uses-permission android:name="android.permission.INTERNET" />',
                  '<uses-permission android:name="android.permission.CAMERA" />',
              ]:
                  if permission not in text:
                      text = text.replace(marker, marker + '\n    ' + permission)
              share_filter = '''
                <intent-filter>
                    <action android:name="android.intent.action.SEND" />
                    <category android:name="android.intent.category.DEFAULT" />
                    <data android:mimeType="text/*" />
                </intent-filter>'''
              if 'android.intent.action.SEND' not in text:
                  text = text.replace('        </activity>', share_filter + '\n        </activity>', 1)
              manifest.write_text(text)
          PY2

      - name: Install packages and static analysis
        shell: bash
        run: |
          flutter pub get
          flutter analyze --no-fatal-infos

      - name: Run full tests
        run: flutter test

      - name: Build release APK
        run: flutter build apk --release

      - name: Verify APK
        shell: bash
        run: |
          test -s build/app/outputs/flutter-apk/app-release.apk
          ls -lh build/app/outputs/flutter-apk/app-release.apk
          sha256sum build/app/outputs/flutter-apk/app-release.apk

      - name: Commit validated fixes
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/qa-finalize-v091.yml tools/finalize_v091.py
          git add lib server test pubspec.yaml .github/workflows/build-android-apk.yml
          git commit -m 'Finalize V0.9.1 QA and bug fixes'
          git push origin main

      - name: Upload validated APK
        uses: actions/upload-artifact@v4
        with:
          name: FlipRadar-V0.9.1-FINAL-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
