name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

concurrency:
  group: flipradar-android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check backend syntax
        run: node --check server/index.js

      - name: Smoke test backend
        shell: bash
        run: |
          PORT=8099 node server/index.js >/tmp/flipradar-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:8099/health >/tmp/health.json; then
              break
            fi
            sleep 0.25
          done
          cat /tmp/health.json
          grep -q '"ok":true' /tmp/health.json
          grep -q '"version":"0.9.1"' /tmp/health.json
          curl -fsS http://127.0.0.1:8099/v1/status >/tmp/status.json
          grep -q '"sources"' /tmp/status.json
          code=$(curl -sS -o /tmp/bad-source.json -w '%{http_code}' 'http://127.0.0.1:8099/v1/market/search?source=bad&q=test')
          test "$code" = "400"
          grep -q 'unsupported_source' /tmp/bad-source.json

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show Flutter version
        run: flutter --version

      - name: Generate Android project
        shell: bash
        run: |
          rm -rf /tmp/flipradar_lib
          cp -r lib /tmp/flipradar_lib
          cp pubspec.yaml /tmp/flipradar_pubspec.yaml
          rm -rf android
          flutter create . --platforms=android --org com.flipradar --project-name flipradar --no-pub
          rm -rf lib
          cp -r /tmp/flipradar_lib lib
          cp /tmp/flipradar_pubspec.yaml pubspec.yaml
          python3 - <<'PY2'
          from pathlib import Path

          app_gradle = Path('android/app/build.gradle.kts')
          if app_gradle.exists():
              text = app_gradle.read_text()
              text = text.replace('applicationId = "com.flipradar.flipradar"', 'applicationId = "com.flipradar.app"')
              app_gradle.write_text(text)

          root_gradle = Path('android/build.gradle.kts')
          if root_gradle.exists():
              text = root_gradle.read_text()
              marker = '// FlipRadar: align Java tasks with Flutter/Kotlin 17'
              if marker not in text:
                  text += '''

          // FlipRadar: align Java tasks with Flutter/Kotlin 17
          subprojects {
              tasks.withType<org.gradle.api.tasks.compile.JavaCompile>().configureEach {
                  sourceCompatibility = "17"
                  targetCompatibility = "17"
              }
          }
          '''
              root_gradle.write_text(text)

          props = Path('android/gradle.properties')
          if props.exists():
              text = props.read_text()
              if 'kotlin.jvm.target.validation.mode=' not in text:
                  text += '\nkotlin.jvm.target.validation.mode=warning\n'
              props.write_text(text)

          manifest = Path('android/app/src/main/AndroidManifest.xml')
          if manifest.exists():
              text = manifest.read_text().replace('android:label="flipradar"', 'android:label="FlipRadar"')
              text = text.replace('android:launchMode="singleTop"', 'android:launchMode="singleTask"')
              marker = '<manifest xmlns:android="http://schemas.android.com/apk/res/android">'
              permissions = [
                  '<uses-permission android:name="android.permission.INTERNET" />',
                  '<uses-permission android:name="android.permission.CAMERA" />',
              ]
              for permission in permissions:
                  if permission not in text:
                      text = text.replace(marker, marker + '\n    ' + permission)
              share_filter = '''
                <intent-filter>
                    <action android:name="android.intent.action.SEND" />
                    <category android:name="android.intent.category.DEFAULT" />
                    <data android:mimeType="text/*" />
                </intent-filter>'''
              if 'android.intent.action.SEND' not in text:
                  text = text.replace('        </activity>', share_filter + '\n        </activity>', 1)
              manifest.write_text(text)
          PY2

      - name: Get packages
        run: flutter pub get

      - name: Static analysis
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Build release APK
        run: flutter build apk --release

      - name: Verify APK
        run: |
          test -s build/app/outputs/flutter-apk/app-release.apk
          ls -lh build/app/outputs/flutter-apk/app-release.apk
          sha256sum build/app/outputs/flutter-apk/app-release.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FlipRadar-V0.10.1-FAST-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
