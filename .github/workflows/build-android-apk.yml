name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

concurrency:
  group: flipradar-android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply compatible V0.14 patches
        shell: bash
        run: |
          if ! grep -q "import 'source_status.dart';" lib/v13_app.dart; then python3 tools/patch_v140_live_source_status.py; fi
          if ! grep -q 'e.live && roles.contains(e.role)' lib/v13_app.dart; then python3 tools/patch_v142_nonlive_market_guard.py; fi
          if ! grep -q 'List<double> v13CleanMarketValues' lib/v13_app.dart; then python3 tools/patch_v143_market_quality.py; fi
          python3 tools/patch_v144_confidence_model.py
          python3 tools/patch_v144_confidence_ui.py

      - name: Verify V0.14.4 boundaries
        shell: bash
        run: |
          grep -q '^version: 0.14.4+27$' pubspec.yaml
          grep -q 'in_app_purchase: ^3.3.0' pubspec.yaml
          grep -q 'google_mobile_ads: ^9.1.0' pubspec.yaml
          grep -q 'workmanager_android: ^0.10.9' pubspec.yaml
          grep -q 'e.live && roles.contains(e.role)' lib/v13_app.dart
          grep -q 'status.isSandbox(source.id)' lib/v13_app.dart
          grep -q 'List<double> v13CleanMarketValues' lib/v13_app.dart
          grep -q 'class V13MarketConfidence' lib/v13_app.dart
          grep -q 'V13MarketConfidence get marketConfidence' lib/v13_app.dart
          grep -q "ValueKey('v0144-confidence-card')" lib/v13_app.dart
          grep -q "ValueKey('v0144-confidence-progress')" lib/v13_app.dart
          grep -q "require('./market_quality')" server/index.js
          ! grep -q 'unawaited(monetization.prepareAds())' lib/v13_app.dart

      - name: Check backend and market quality
        run: |
          node --check server/index.js
          node --check server/market_quality.js
          node server/market_quality_test.js

      - name: Smoke test sandbox boundary
        shell: bash
        run: |
          PORT=8099 node server/index.js >/tmp/flipradar-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          for i in {1..20}; do
            curl -fsS http://127.0.0.1:8099/health >/tmp/health.json && break
            sleep 0.25
          done
          grep -q '"ok":true' /tmp/health.json
          grep -q '"ebay_environment":"sandbox"' /tmp/health.json
          curl -fsS http://127.0.0.1:8099/v1/status >/tmp/status.json
          grep -q '"data_kind":"sandbox_mock_data"' /tmp/status.json

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android project
        shell: bash
        run: |
          cp -r lib /tmp/flipradar_lib
          cp pubspec.yaml /tmp/flipradar_pubspec.yaml
          rm -rf android
          flutter create . --platforms=android --org com.flipradar --project-name flipradar --no-pub
          rm -rf lib
          cp -r /tmp/flipradar_lib lib
          cp /tmp/flipradar_pubspec.yaml pubspec.yaml
          python3 tools/prepare_android_ci.py
          grep -q 'applicationId = "com.flipradar.app"' android/app/build.gradle.kts
          grep -q 'com.google.android.gms.ads.APPLICATION_ID' android/app/src/main/AndroidManifest.xml

      - name: Get packages
        run: flutter pub get

      - name: Static analysis
        run: flutter analyze --no-fatal-infos

      - name: Run all tests
        run: flutter test

      - name: Run critical regressions explicitly
        run: |
          flutter test test/v131_startup_test.dart
          flutter test test/v142_nonlive_market_guard_test.dart
          flutter test test/v143_market_quality_test.dart
          flutter test test/v144_market_confidence_test.dart

      - name: Build release APK
        run: flutter build apk --release

      - name: Verify and upload APK
        run: |
          test -s build/app/outputs/flutter-apk/app-release.apk
          ls -lh build/app/outputs/flutter-apk/app-release.apk
          sha256sum build/app/outputs/flutter-apk/app-release.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FlipRadar-V0.14.4-CONFIDENCE-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Persist validated V0.14.4 source
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/v13_app.dart pubspec.yaml
          if ! git diff --cached --quiet; then
            git commit -m 'Finalize FlipRadar V0.14.4 confidence score [skip ci]'
            git push origin main
          fi