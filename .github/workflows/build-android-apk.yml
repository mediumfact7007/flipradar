name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check backend syntax
        run: node --check server/index.js

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show Flutter version
        run: flutter --version

      - name: Generate Android project
        shell: bash
        run: |
          rm -rf /tmp/flipradar_lib
          cp -r lib /tmp/flipradar_lib
          cp pubspec.yaml /tmp/flipradar_pubspec.yaml
          rm -rf android
          flutter create . --platforms=android --org com.flipradar --project-name flipradar --no-pub
          rm -rf lib
          cp -r /tmp/flipradar_lib lib
          cp /tmp/flipradar_pubspec.yaml pubspec.yaml
          python3 - <<'PY2'
          from pathlib import Path
          gradle = Path('android/app/build.gradle.kts')
          if gradle.exists():
              text = gradle.read_text()
              text = text.replace('applicationId = "com.flipradar.flipradar"', 'applicationId = "com.flipradar.app"')
              gradle.write_text(text)
          manifest = Path('android/app/src/main/AndroidManifest.xml')
          if manifest.exists():
              text = manifest.read_text().replace('android:label="flipradar"', 'android:label="FlipRadar"')
              text = text.replace('android:launchMode="singleTop"', 'android:launchMode="singleTask"')
              marker = '<manifest xmlns:android="http://schemas.android.com/apk/res/android">'
              permissions = [
                  '<uses-permission android:name="android.permission.INTERNET" />',
                  '<uses-permission android:name="android.permission.CAMERA" />',
              ]
              for permission in permissions:
                  if permission not in text:
                      text = text.replace(marker, marker + '\n    ' + permission)
              share_filter = '''
                <intent-filter>
                    <action android:name="android.intent.action.SEND" />
                    <category android:name="android.intent.category.DEFAULT" />
                    <data android:mimeType="text/*" />
                </intent-filter>'''
              if 'android.intent.action.SEND' not in text:
                  text = text.replace('        </activity>', share_filter + '\n        </activity>', 1)
              manifest.write_text(text)
          PY2

      - name: Get packages
        run: flutter pub get

      - name: Run tests
        run: flutter test

      - name: Build release APK
        run: flutter build apk --release

      - name: Verify APK
        run: |
          ls -lh build/app/outputs/flutter-apk/app-release.apk
          sha256sum build/app/outputs/flutter-apk/app-release.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FlipRadar-V0.8-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
