name: Apply guarded product patches

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-v150-home-ux.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply guarded buyback endpoint patch
        run: python3 tools/patch_buyback_endpoint.py
      - name: Verify intended diff only
        run: |
          git diff --check
          git diff --exit-code -- tools/patch_buyback_endpoint.py
          git diff -- server/index.js
          grep -q "buybackSourceStatus" server/index.js
          grep -q "'/v1/buyback/search'" server/index.js
          grep -q "no price is estimated or fabricated" server/index.js
      - name: Commit product change
        run: |
          if git diff --quiet -- server/index.js; then
            echo "Buyback endpoint patch already applied; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/index.js
          git commit -m "Expose safe buyback search endpoint"
          git push origin HEAD:main
