name: Apply guarded product patches

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-v150-home-ux.yml'
      - 'tools/patch_buyback_endpoint.py'
      - 'tools/patch_buyback_deal_ui.py'
      - 'tools/patch_watchlist_home_attention.py'
      - 'tools/patch_watchlist_filter_sync.py'
      - 'tools/patch_watchlist_recheck_queue.py'
      - 'tools/patch_watchlist_recheck_oldest.py'
      - 'tools/patch_deal_alert_toggle.py'
      - 'tools/patch_deal_alert_recheck_result.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply guarded buyback endpoint patch
        run: python3 tools/patch_buyback_endpoint.py
      - name: Apply guarded buyback deal UI patch
        run: python3 tools/patch_buyback_deal_ui.py
      - name: Apply guarded watchlist retention patch
        run: python3 tools/patch_watchlist_home_attention.py
      - name: Apply watchlist navigation sync fix
        run: python3 tools/patch_watchlist_filter_sync.py
      - name: Apply watchlist recheck queue UX
        run: python3 tools/patch_watchlist_recheck_queue.py
      - name: Recheck the oldest stale saved deal first
        run: python3 tools/patch_watchlist_recheck_oldest.py
      - name: Add saved-deal alert toggle
        run: python3 tools/patch_deal_alert_toggle.py
      - name: Show explainable alert result during recheck
        run: python3 tools/patch_deal_alert_recheck_result.py
      - name: Verify intended diff only
        run: |
          git diff --check
          git diff --exit-code -- tools/patch_buyback_endpoint.py tools/patch_buyback_deal_ui.py tools/patch_watchlist_home_attention.py tools/patch_watchlist_filter_sync.py tools/patch_watchlist_recheck_queue.py tools/patch_watchlist_recheck_oldest.py tools/patch_deal_alert_toggle.py tools/patch_deal_alert_recheck_result.py
          git diff -- server/index.js lib/v13_app.dart
          test "$(grep -Fc "const { fetchBuybackOffers, sourceStatus: buybackSourceStatus } = require('./buyback_source');" server/index.js)" -eq 1
          test "$(grep -Fc "buyback: buybackSourceStatus()," server/index.js)" -eq 1
          test "$(grep -Fc "if (req.method === 'GET' && url.pathname === '/v1/buyback/search')" server/index.js)" -eq 1
          grep -q "no price is estimated or fabricated" server/index.js
          grep -q "v151-buyback-condition" lib/v13_app.dart
          grep -q "BuybackComparisonCard" lib/v13_app.dart
          grep -q "v152-watchlist-home-attention" lib/v13_app.dart
          grep -q "initialFilter: flipsInitialFilter" lib/v13_app.dart
          grep -q "oldWidget.initialFilter != widget.initialFilter" lib/v13_app.dart
          grep -q "freshCount = saved.length - stale.length" lib/v13_app.dart
          grep -q "NÄCHSTEN PRÜFEN" lib/v13_app.dart
          grep -q "stale.isEmpty ? saved.first : stale.first" lib/v13_app.dart
          test "$(grep -Fc "import 'deal_alert_toggle.dart';" lib/v13_app.dart)" -eq 1
          test "$(grep -Fc "DealAlertToggle(flipId: flip.id, english: english)" lib/v13_app.dart)" -eq 1
          test "$(grep -Fc "import 'deal_alert_result_card.dart';" lib/v13_app.dart)" -eq 1
          test "$(grep -Fc "DealAlertResultCard(" lib/v13_app.dart)" -eq 1
          node --check server/index.js
      - name: Commit product change
        run: |
          if git diff --quiet -- server/index.js lib/v13_app.dart; then
            echo "Product patches already applied; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/index.js lib/v13_app.dart
          git commit -m "Show explainable deal alert during recheck"
          git push origin HEAD:main
